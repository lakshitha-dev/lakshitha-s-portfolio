name: Deploy React + Vite App to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'  # runs daily at 6am UTC

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm install
        
      - name: Fetch Medium articles
        run: node scripts/fetch-medium.mjs

      - name: Build project
        run: npm run build
        
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          # cname: lakshitha.dev   # re-enable once the domain registration is renewed
